# ──────────────────────────────────────────────
# HTTP Server (use before HTTPS is configured)
# ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/plain text/css;

    # Request limits
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Health check (no rate limit, no logging)
    location /api/health {
        proxy_pass http://bfsi_backend/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Auth endpoints (stricter rate limit)
    location /api/auth {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://bfsi_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # All API routes
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://bfsi_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Block non-API requests
    location / {
        return 404;
    }
}

