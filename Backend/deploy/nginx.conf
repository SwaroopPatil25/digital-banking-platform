# ============================================
# BFSI Backend - Production Nginx Config
# ============================================
# Location: /etc/nginx/sites-available/bfsi-api
# Enable:   sudo ln -sf /etc/nginx/sites-available/bfsi-api /etc/nginx/sites-enabled/
#
# SETUP ORDER:
#   1. Deploy with HTTP block only (comment out HTTPS + redirect)
#   2. Run certbot: sudo certbot --nginx -d api.yourdomain.com
#   3. Uncomment HTTPS block and HTTP→HTTPS redirect
#   4. Comment out the plain HTTP server block
#   5. sudo nginx -t && sudo systemctl reload nginx

# ──────────────────────────────────────────────
# Rate limiting zone (shared across workers)
# ──────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;

# ──────────────────────────────────────────────
# Upstream backend
# ──────────────────────────────────────────────
upstream bfsi_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ──────────────────────────────────────────────
# HTTP → HTTPS Redirect (enable after certbot)
# ──────────────────────────────────────────────
# server {
#     listen 80;
#     listen [::]:80;
#     server_name api.yourdomain.com;
#
#     # Certbot challenge (keep for renewals)
#     location /.well-known/acme-challenge/ {
#         root /var/www/certbot;
#     }
#
#     location / {
#         return 301 https://$host$request_uri;
#     }
